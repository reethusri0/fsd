<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Key Recovery — LearnZone Ultra</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script>
    (function(){
      var t = localStorage.getItem('lzu_theme') || localStorage.getItem('lz_theme');
      var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme:dark)').matches;
      if (t === 'dark' || (!t && dark)) document.documentElement.classList.add('dark');
    })();
  </script>
</head>
<body style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--color-bg);">

  <div class="ultra-card animate-entrance" style="max-width:440px;width:100%;padding:40px;">
    <div style="text-align:center;margin-bottom:28px;">
      <a href="index.html" class="ultra-brand" style="justify-content:center;margin-bottom:16px;">
        <div class="brand-icon-wrap">
          <i class="fas fa-cube" style="color:#FFF;"></i>
        </div>
        <div>
          <span class="brand-text">LearnZone</span>
          <span class="brand-badge">ULTRA</span>
        </div>
      </a>
      <h1 style="font-size:1.6rem;margin-bottom:8px;">Reset Credentials</h1>
      <p style="color:var(--color-text-secondary);font-size:0.85rem;">Enter your email to receive recovery instructions.</p>
    </div>

    <!-- Educational Demo Note -->
    <div style="background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.25);border-radius:12px;padding:12px 16px;margin-bottom:24px;font-size:0.8rem;color:#D97706;display:flex;gap:10px;align-items:flex-start;">
      <i class="fas fa-triangle-exclamation" style="margin-top:2px;"></i>
      <div><strong>Platform Notice:</strong> This client prototype simulates verification mechanisms. No live SMTP relays are dispatched.</div>
    </div>

    <form id="ultraForgotForm" novalidate>
      <div class="ultra-form-group">
        <label class="ultra-label" for="recoveryEmail">Registered Email</label>
        <div class="ultra-input-wrap">
          <i class="fas fa-envelope prefix-icon"></i>
          <input type="email" id="recoveryEmail" class="ultra-input has-prefix" placeholder="student@mit.edu" required />
        </div>
        <div id="recoveryErr" style="color:#EF4444;font-size:0.75rem;margin-top:6px;"></div>
      </div>

      <button type="submit" id="btnRecover" class="btn-ultra btn-ultra-primary btn-ultra-glow" style="width:100%;padding:13px;">
        <i class="fas fa-paper-plane"></i>
        <span>Simulate Recovery Link</span>
      </button>
    </form>

    <div id="successPanel" style="display:none;margin-top:24px;text-align:center;padding:16px;background:rgba(16,185,129,0.08);border-radius:12px;border:1px solid rgba(16,185,129,0.2);">
      <i class="fas fa-check-circle" style="color:#10B981;font-size:1.8rem;margin-bottom:8px;"></i>
      <div style="font-weight:700;font-size:0.95rem;color:var(--color-text);">Recovery Link Simulated</div>
      <p style="font-size:0.8rem;color:var(--color-text-secondary);margin-top:4px;">If registered, instructions would be sent to <span id="confirmedEmailTxt" style="font-weight:600;"></span>.</p>
    </div>

    <div style="margin-top:24px;text-align:center;font-size:0.85rem;">
      <a href="login.html" style="color:var(--color-primary);font-weight:600;display:inline-flex;align-items:center;gap:6px;">
        <i class="fas fa-arrow-left"></i> Return to login
      </a>
    </div>
  </div>

  <script src="utils.js"></script>
  <script>
    const form = document.getElementById('ultraForgotForm');
    const input = document.getElementById('recoveryEmail');
    const err = document.getElementById('recoveryErr');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = '';
      const email = input.value.trim();

      if (!email || !isValidEmail(email)) {
        err.textContent = 'Please enter a valid email address.';
        return;
      }

      const btn = document.getElementById('btnRecover');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';

      await new Promise(r => setTimeout(r, 600));

      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-paper-plane"></i> <span>Simulate Recovery Link</span>';
      document.getElementById('confirmedEmailTxt').textContent = email;
      document.getElementById('successPanel').style.display = 'block';
      Toast.info('Verification Dispatched', 'Simulated password reset cycle triggered.');
    });
  </script>
</body>
</html>
